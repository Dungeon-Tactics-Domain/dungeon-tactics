<!doctype html>
<!-- POC descartável (12/11): tela parada de Gariland em pixel art 2D isométrica, com o Tiny Tactics: Battle Kit I
     (Tio Palada, CC0), só para o Fernando comparar estilos com o 3D do estudo. Sem batalha, sem regras, fora do build. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POC pixel art 2D</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2440; overflow: hidden; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; }
</style>
<canvas id="c"></canvas>
<script>
  // mesmo relevo de src/shared/battle/fft/gariland.ts (cópia: a spike não entra no build). Linha = y, coluna = x.
  const HEIGHTS = [
    [2, 2, 5, 2, 0, 0, 0, 0, 2, 3],
    [2, 2, 2, 2, 4, 2, 0, 2, 2, 3],
    [0, 0, 2, 8, 6, 2, 0, 2, 2, 2],
    [2, 0, 2, 8, 8, 2, 0, 2, 5, 2],
    [2, 0, 0, 6, 6, 2, 2, 2, 2, 0],
    [2, 0, 2, 2, 2, 2, 2, 2, 2, 0],
    [2, 0, 8, 6, 2, 0, 0, 2, 4, 5],
    [2, 2, 8, 8, 2, 0, 0, 2, 6, 6],
    [0, 2, 6, 6, 2, 0, 2, 2, 8, 8],
    [0, 2, 3, 5, 4, 0, 2, 2, 6, 8],
    [0, 0, 0, 0, 2, 0, 2, 2, 2, 1],
    [0, 2, 2, 2, 2, 0, 0, 0, 2, 2],
    [7, 8, 7, 2, 2, 2, 2, 2, 2, 2],
    [8, 10, 8, 6, 4, 0, 0, 2, 2, 3],
    [8, 9, 8, 7, 4, 0, 0, 0, 2, 3],
  ];
  const TREES = new Set(['2,0', '8,3']);
  // personagens do pacote nas casas de partida do estudo; heróis olham para +y (SE espelhado), inimigos para -y (NE)
  const UNITS = [
    { who: 'fighter', x: 7, y: 1, dir: 'SE', flip: true },
    { who: 'mage', x: 6, y: 2, dir: 'SE', flip: true },
    { who: 'cleric', x: 3, y: 1, dir: 'SE', flip: true },
    { who: 'fighter', x: 8, y: 12, dir: 'NE' },
    { who: 'mage', x: 4, y: 12, dir: 'NE' },
    { who: 'cleric', x: 5, y: 13, dir: 'NE' },
  ];
  const T = 32, HALF_W = 16, HALF_H = 8, LEVEL = 8; // losango de 32x16; 1 "h" do FFT = 8 px (meio cubo do pacote)
  // célula (coluna, linha) de cada bloco no tileset de 32x32
  const TILE = { grass: [0, 0], dirt: [8, 0], stone: [8, 5], water: [0, 2], tree: [1, 3] };
  const W = HEIGHTS[0].length, H = HEIGHTS.length, MAX_H = 10;
  const mapW = (W + H) * HALF_W, mapH = (W + H) * HALF_H + MAX_H * LEVEL + T;

  const load = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src; });
  const dir = 'tiny-tactics/';
  Promise.all([
    load(dir + '20240420tinyTacticsTileset00.png'),
    ...UNITS.map((u) => load(`${dir}20240427${u.who}-walking${u.dir}.png`)),
  ]).then(([tiles, ...sprites]) => {
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    const draw = () => {
      // escala inteira em pixels do aparelho: pixel art com escala quebrada borra
      const dpr = devicePixelRatio, scale = Math.max(1, Math.floor(Math.min((innerWidth * dpr) / mapW, (innerHeight * dpr) / mapH)));
      canvas.width = mapW * scale; canvas.height = mapH * scale;
      canvas.style.width = canvas.width / dpr + 'px'; canvas.style.height = canvas.height / dpr + 'px';
      ctx.imageSmoothingEnabled = false;
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      // canto de cima do bloco da casa (x, y) no nível k
      const at = (x, y, k) => [(x - y + H - 1) * HALF_W, (x + y) * HALF_H + (MAX_H - k) * LEVEL];
      const tile = ([c, r], px, py) => ctx.drawImage(tiles, c * T, r * T, T, T, px, py, T, T);
      // ordem de desenho: de trás para a frente (x + y crescente) e, em cada casa, de baixo para cima
      for (let s = 0; s <= W + H - 2; s++) {
        for (let x = Math.max(0, s - H + 1); x <= Math.min(W - 1, s); x++) {
          const y = s - x, h = HEIGHTS[y][x];
          const top = h === 0 ? TILE.water : h >= 5 ? TILE.stone : TILE.grass; // h 0 = rio, h >= 5 = telhado (leitura nossa)
          for (let k = 0; k < h; k++) tile(TILE.dirt, ...at(x, y, k));
          const [px, py] = at(x, y, h);
          tile(top, px, py);
          if (TREES.has(`${x},${y}`)) tile(TILE.tree, px, py - 20);
          const i = UNITS.findIndex((u) => u.x === x && u.y === y);
          if (i < 0) continue;
          // pés do boneco no centro do losango do topo
          ctx.save();
          ctx.translate(px + HALF_W, py + HALF_H + 2);
          if (UNITS[i].flip) ctx.scale(-1, 1);
          ctx.drawImage(sprites[i], 0, 0, T, T, -16, -30, T, T);
          ctx.restore();
        }
      }
    };
    draw();
    addEventListener('resize', draw);
  });
</script>
