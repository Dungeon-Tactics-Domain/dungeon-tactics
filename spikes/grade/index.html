<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>POC grade · Dungeon Tactics</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1f2a; color: #f2ead3; font: 15px/1.3 system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    #info { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px; background: #0009; }
    #info b { color: #ffd479; }
    #bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 6px; padding: 8px; background: #0009; flex-wrap: wrap; justify-content: center; }
    #bar button { min-width: 44px; min-height: 44px; padding: 0 12px; border: 2px solid #8a7550; border-radius: 6px; background: #2c2a24; color: #f2ead3; font: inherit; }
    #bar button.on { background: #8a7550; color: #1b1f2a; }
  </style>
</head>
<body>
  <div id="info"></div>
  <div id="bar">
    <button id="mover" class="on">Mover</button>
    <button id="acao">Ação</button>
    <button id="girarE" aria-label="Girar à esquerda">⟲</button>
    <button id="girarD" aria-label="Girar à direita">⟳</button>
    <button id="pixel">Pixel 3</button>
    <button id="grade"></button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
