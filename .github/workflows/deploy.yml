# Game live at https://dungeon-tactics.fernandorffdev.com. Manual trigger only since Nov 13: commits go straight to
# master and publishing is done by hand (npx wrangler deploy); without the Cloudflare secret, the trigger on every push only failed
name: Production

on:
  workflow_dispatch:

# one deploy at a time, without cancelling one that already started
concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx vite build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # the served index-*.js must be this build's (cache or a half-done deploy show up here)
      - name: Check the served version
        run: |
          esperado=$(ls dist/assets | grep -E '^index-.*\.js$')
          for i in $(seq 1 30); do curl -s https://dungeon-tactics.fernandorffdev.com/ | grep -q "$esperado" && exit 0; sleep 5; done
          echo "o site não serve $esperado"; exit 1
      - run: node scripts/smoke.mjs https://dungeon-tactics.fernandorffdev.com
