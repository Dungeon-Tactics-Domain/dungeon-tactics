# Checks for every pull request and every push to master: lint and format, types, tests with coverage, build and a
# browser smoke test of the build
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npx vite build
      # the Chromium build playwright-core is tested with, not the runner's Chrome; WebGL runs on SwiftShader
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke
        env:
          PW_CHANNEL: chromium
